apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-service-staging
resources:
  - ../../base
images:
  - name: product-service
    newName: image-registry.openshift-image-registry.svc:5000/product-service-cicd/product-service
    newTag: v1
patches:
  - target:
      kind: Deployment
      name: product-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

